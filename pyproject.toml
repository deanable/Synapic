[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapic"
version = "2.5.5"
description = "AI-powered DAM tooling for Synapic"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
  "customtkinter>=5.2.2",
  "requests>=2.32.5",
  "pillow>=10.0.0",
  "piexif>=1.1.3",
  "iptcinfo3>=2.1.4",
  "imagehash>=4.3.1",
  "tqdm>=4.67.1",
  "psutil>=5.9.0",
  "huggingface_hub>=0.28.0",
  "hf_xet>=1.1.0",
  "transformers>=4.57.2",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "timm>=1.0.24",
  "accelerate>=1.12.0",
  "qwen-vl-utils>=0.0.14",
  "groq>=0.11.0",
  "ollama>=0.4.0",
  "cerebras_cloud_sdk>=1.30.0",
  "protobuf>=6.33.3",
  "sentencepiece>=0.2.1",
  "pyinstaller>=6.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
# importlib mode lets test files share a basename across directories
# (e.g. tests/unit/test_hash_comparison.py and
# tests/unit/core/dedup/test_hash_comparison.py) without collection clashes.
# tests/manual holds interactive experiment scripts (run directly, not via
# pytest) — ignore them so their helper functions aren't collected as tests.
addopts = "-ra -q --import-mode=importlib --ignore=tests/manual"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = false
files = "src"
explicit_package_bases = true
